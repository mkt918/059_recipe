<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レシピ帳</title>
    <meta name="description" content="よく作る料理の手順をすぐ引ける個人用レシピ帳。">
    <meta name="color-scheme" content="light">
    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Icon sprite -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
        </symbol>
        <symbol id="i-heart" viewBox="0 0 24 24">
            <path d="M12 20.5 4.2 12.9a5 5 0 0 1 7.1-7.1l.7.7.7-.7a5 5 0 1 1 7.1 7.1z" fill="currentColor"></path>
        </symbol>
        <symbol id="i-heart-o" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
            <path d="M12 20.5 4.2 12.9a5 5 0 0 1 7.1-7.1l.7.7.7-.7a5 5 0 1 1 7.1 7.1z"></path>
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M6 6l12 12M18 6 6 18"></path>
        </symbol>
        <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"></path>
            <path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"></path>
        </symbol>
        <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 15l6-6 6 6"></path>
        </symbol>
        <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6"></path>
        </symbol>
    </svg>

    <header class="site-header">
        <div class="wrap header-inner">
            <a class="brand" href="./">
                <img src="favicon.png" alt="" width="28" height="28">
                <span>レシピ帳</span>
            </a>
            <div class="search">
                <svg class="search-icon" aria-hidden="true"><use href="#i-search"></use></svg>
                <input type="search" id="q" placeholder="レシピ名・食材・種別で検索" autocomplete="off" spellcheck="false" aria-label="レシピを検索">
            </div>
            <div class="header-actions">
                <a class="sheet-link" href="https://docs.google.com/spreadsheets/d/e/2PACX-1vQlMrVlcfS3ntbwo5kfLdNrziho2jOmz3X_Qq9-ojUozpM0YzNUGIrc9HZxCSI7AP43BcGe4shmwLsU/pubhtml?gid=0&single=true" target="_blank" rel="noopener noreferrer">
                    <svg aria-hidden="true"><use href="#i-link"></use></svg>
                    <span>データを編集</span>
                </a>
                <button type="button" id="favToggle" class="fav-toggle" aria-pressed="false">
                    <svg aria-hidden="true"><use href="#i-heart-o"></use></svg>
                    <span>お気に入り</span>
                    <span class="fav-count" id="favCount" hidden>0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="wrap">
        <section class="filters" aria-label="絞り込み">
            <div class="filter-group">
                <h2 class="filter-label">種別</h2>
                <div class="chips" id="catFilters" role="group" aria-label="種別で絞り込み"></div>
            </div>
            <div class="filter-group">
                <div class="filter-label-row">
                    <h2 class="filter-label">主な食材<span class="hint">（すべて含む）</span></h2>
                    <button type="button" id="ingMore" class="link-btn" hidden></button>
                </div>
                <div class="chips" id="ingFilters" role="group" aria-label="食材で絞り込み"></div>
            </div>
        </section>

        <div class="result-bar">
            <p id="count" class="count" aria-live="polite">読み込み中…</p>
            <button type="button" id="clearAll" class="link-btn" hidden>絞り込みを解除</button>
        </div>

        <p id="status" class="status" role="status" hidden></p>

        <ul class="grid" id="grid" aria-label="レシピ一覧">
            <li class="card skeleton" aria-hidden="true"></li>
            <li class="card skeleton" aria-hidden="true"></li>
            <li class="card skeleton" aria-hidden="true"></li>
            <li class="card skeleton" aria-hidden="true"></li>
            <li class="card skeleton" aria-hidden="true"></li>
            <li class="card skeleton" aria-hidden="true"></li>
        </ul>
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <p>© 2026 mkt918 レシピ帳 — 個人用</p>
        </div>
    </footer>

    <div class="jump" id="jump">
        <button type="button" id="jumpTop" aria-label="最上部へ移動" hidden>
            <svg aria-hidden="true"><use href="#i-up"></use></svg>
        </button>
        <button type="button" id="jumpBottom" aria-label="最下部へ移動" hidden>
            <svg aria-hidden="true"><use href="#i-down"></use></svg>
        </button>
    </div>

    <dialog id="detail" aria-labelledby="detailTitle">
        <button type="button" class="dialog-close" id="detailClose" aria-label="閉じる">
            <svg aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
        <div id="detailBody"></div>
    </dialog>

    <template id="tpl-card">
        <li class="card">
            <div class="card-head">
                <span class="tag" data-cat></span>
                <button type="button" class="fav-btn" data-fav aria-pressed="false" aria-label="お気に入りに追加">
                    <svg class="ico-off" aria-hidden="true"><use href="#i-heart-o"></use></svg>
                    <svg class="ico-on" aria-hidden="true"><use href="#i-heart"></use></svg>
                </button>
            </div>
            <h3 class="card-title"><button type="button" class="card-open" data-open></button></h3>
            <p class="card-ings" data-ings></p>
            <div class="card-foot">
                <button type="button" class="btn-detail" data-open>手順を見る</button>
            </div>
        </li>
    </template>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
